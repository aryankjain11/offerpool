<!doctype html>
<html lang="en-IN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OfferPool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: "kintsugi night". Dark ink surfaces that get lighter as they rise; celadon text; gold only for money and primary actions.
   Top nav on desktop, bottom tab bar on phones. Shopping is one focused column; checkout and progress open in a sheet. */
:root{
  color-scheme:dark;
  --ink-0:oklch(0.165 0.022 255);
  --ink-1:oklch(0.205 0.026 255);
  --ink-2:oklch(0.245 0.029 255);
  --ink-3:oklch(0.295 0.031 255);
  --text:oklch(0.94 0.02 150);
  --text-2:oklch(0.80 0.03 160);
  --text-3:oklch(0.66 0.026 205);
  --celadon:oklch(0.87 0.065 150);
  --celadon-tile:oklch(0.86 0.05 150);
  --gold:oklch(0.82 0.135 84);
  --gold-hi:oklch(0.90 0.10 92);
  --gold-lo:oklch(0.68 0.14 68);
  --gold-ink:oklch(0.21 0.04 70);
  --gold-soft:oklch(0.82 0.135 84 / 0.13);
  --gold-line:oklch(0.82 0.135 84 / 0.42);
  --good:oklch(0.80 0.13 158); --good-soft:oklch(0.80 0.13 158 / 0.14);
  --warn:oklch(0.79 0.15 52);  --warn-soft:oklch(0.79 0.15 52 / 0.15);
  --bad:oklch(0.73 0.17 25);   --bad-soft:oklch(0.73 0.17 25 / 0.15);
  --info:oklch(0.80 0.09 232); --info-soft:oklch(0.80 0.09 232 / 0.14);
  --line:oklch(1 0 0 / 0.09);
  --line-2:oklch(1 0 0 / 0.16);
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --rin:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink-0)}
body{background:radial-gradient(70% 55% at 88% -5% in oklch, oklch(0.62 0.12 72 / 0.20), transparent 70%) fixed, radial-gradient(50% 40% at 0% 100% in oklch, oklch(0.5 0.06 160 / 0.10), transparent 70%) fixed, var(--ink-0);
  color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink-0)}
body.locked{overflow:hidden}
.app{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.08}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,5.6vw,66px);letter-spacing:-.01em;color:var(--celadon)}
h1 em,h2 em{font-style:italic;background:linear-gradient(100deg in oklch,var(--gold-hi),var(--gold) 45%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,2.6vw,30px);color:var(--celadon);letter-spacing:-.005em}
h3{font-size:16px;font-weight:700;color:var(--text);line-height:1.3}
p{margin:0}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.meta{--sw:1.6;color:var(--text-3);font-size:13.5px;font-weight:500}
.label{--sw:2;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);display:inline-flex;gap:7px;align-items:center}
.eyebrow{--sw:2.1;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-2);display:inline-flex;gap:8px;align-items:center}
.eyebrow .ico{color:var(--gold)}
.lede{color:var(--text-2);max-width:60ch;font-size:16.5px}

.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--sw,1.6);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.icons{position:relative;display:inline-grid;width:1.15em;height:1.15em;flex:none}
.icons>span{grid-area:1/1;display:grid;transition:opacity .28s ease,filter .28s ease,transform .28s ease}
.icons .ib{opacity:0;filter:blur(4px);transform:scale(.6)}
.swap.done .icons .ia{opacity:0;filter:blur(4px);transform:scale(.6)}
.swap.done .icons .ib{opacity:1;filter:blur(0);transform:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:oklch(0.165 0.022 255 / 0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:12px 24px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;letter-spacing:.3em;font-size:14px;text-transform:uppercase;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;align-items:center}
.tabs .sep{width:1px;height:20px;background:var(--line-2);margin-inline:8px}
.tab{--sw:1.9;border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--text);background:var(--ink-2)}
.tab[aria-current="page"]{color:var(--gold-ink);background:var(--gold)}
.tab.minor{font-size:12.5px;color:var(--text-3);--sw:1.8}
.tab.minor[aria-current="page"]{color:var(--text);background:var(--ink-3)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:oklch(0.98 0 0);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.proto{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .top-in{justify-content:space-between}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;gap:2px;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
    background:oklch(0.2 0.026 255 / 0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .bnav .tab{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;border-radius:12px;position:relative;--sw:1.9}
  .bnav .tab .ico{width:20px;height:20px}
  .bnav .badge{position:absolute;top:2px;right:calc(50% - 22px)}
}

/* page */
.wrap{flex:1;width:100%;max-width:1160px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px;align-content:start}
@media (max-width:760px){.wrap{padding-bottom:110px}}
.foot{max-width:1160px;margin:0 auto;width:100%;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;color:var(--text-3);font-size:12.5px}
@media (max-width:760px){.foot{padding-bottom:100px}}
.hero{display:grid;gap:14px;padding-top:8px}
.seam{width:min(520px,100%);height:28px;display:block;overflow:visible}
.seam path{fill:none;stroke:url(#seamGrad);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px oklch(0.82 0.135 84 / 0.55))}
.focus-col{width:100%;max-width:820px;display:grid;gap:16px}
.stack{display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:10px 16px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* surfaces: nested radius = outer radius − padding */
.panel{--pad:22px;--rad:30px;--rin:calc(var(--rad) - var(--pad));background:var(--ink-1);border:1px solid var(--line);border-radius:var(--rad);padding:var(--pad);display:grid;gap:16px;min-width:0}
.panel.sm{--pad:16px;--rad:24px;gap:12px}
@media (max-width:520px){.panel{--pad:16px;--rad:24px}}
.sub{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--rin);padding:14px;display:grid;gap:10px;min-width:0}

/* buttons */
.btn{--sw:2;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--ink-2);color:var(--text);font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--ink-3)}
.btn.primary{background:linear-gradient(180deg in oklch,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--gold-ink);border-color:oklch(1 0 0 / 0.22);box-shadow:0 0 0 1px oklch(0.82 0.135 84 / 0.15),0 6px 22px -8px oklch(0.82 0.135 84 / 0.55)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.outline{background:transparent;border-color:var(--gold-line);color:var(--gold);border-radius:999px}
.btn.outline:hover{background:var(--gold-soft)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.quiet:hover{background:var(--ink-2);color:var(--text)}
.btn.demo{background:transparent;border:1px dashed var(--gold-line);color:var(--gold);font-weight:600}
.btn.demo:hover{background:var(--gold-soft)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.btn.icon-only{padding:0;width:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:760px){.btn{min-height:44px}.btn.sm{min-height:40px}}

/* fields */
.field{display:grid;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:650;color:var(--text-2)}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--ink-0);border-radius:var(--rin);padding:10px 12px;color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea{resize:vertical;min-height:78px;line-height:1.45}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field-error{--sw:1.6;color:var(--bad);font-size:14px;display:flex;gap:8px;align-items:center}

/* search */
.finder{--pad:10px;--rad:26px;gap:18px}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--ink-0);border:1px solid var(--line-2);border-radius:var(--rin);padding:6px 6px 6px 16px;--rin2:calc(var(--rin) - 6px)}
.searchbar:focus-within{border-color:var(--gold-line)}
.searchbar .ico{color:var(--text-3);--sw:1.6}
.searchbar input{border:0;background:none;padding:10px 4px;font-size:15.5px;flex:1;border-radius:0}
.searchbar input:focus-visible{outline:none}
.searchbar .btn{border-radius:var(--rin2);min-height:44px}
.finder-body{display:grid;gap:14px;padding:6px 12px 12px}
@media (max-width:520px){.searchbar{flex-wrap:wrap;padding:6px}.searchbar>.ico{display:none}.searchbar input{padding:10px}.searchbar .btn{width:100%}}

/* carousel with faded edges */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 12% 10px;margin-inline:-12px;
  -webkit-mask:linear-gradient(90deg,transparent,black 15% 85%,transparent);mask:linear-gradient(90deg,transparent,black 15% 85%,transparent);scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent}
.pcard{--pad:8px;--rad:20px;flex:0 0 190px;scroll-snap-align:center;display:grid;gap:8px;text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--rad);padding:var(--pad);padding-bottom:12px;cursor:pointer;color:var(--text)}
.pcard:hover{background:var(--ink-3)}
.pcard.on{border-color:var(--gold-line);box-shadow:inset 0 0 0 1px var(--gold-line)}
.ptile{border-radius:calc(var(--rad) - var(--pad));background:var(--celadon-tile);isolation:isolate;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.ptile svg{width:78%;height:auto;mix-blend-mode:multiply}
.pname{font-weight:700;font-size:14px;padding-inline:4px;line-height:1.3}
.pcard .meta{padding-inline:4px}
.mini-tile{width:64px;height:48px;border-radius:12px;background:var(--celadon-tile);isolation:isolate;display:grid;place-items:center;flex:none}
.mini-tile svg{width:84%;mix-blend-mode:multiply}

/* chips & pills */
.chip{--sw:1.8;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--ink-2);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.chip button{border:0;background:none;color:var(--text-3);cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0}
.chip button:hover{background:var(--ink-3);color:var(--text)}
.pill{--sw:2;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:oklch(1 0 0 / 0.06);color:var(--text-2);line-height:1.3}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.mycards summary{--sw:1.6;display:inline-flex;gap:8px;align-items:center;color:var(--text-2);font-size:14px;padding:4px 0}
.mycards summary b{color:var(--text);font-weight:650}
.mycards summary .edit{color:var(--gold);font-weight:650}
.mycards[open] summary .edit{display:none}
.mycards .sub{margin-top:10px}

/* guide */
.guide{--pad:12px;--rad:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:14px;align-items:center;background:linear-gradient(100deg in oklch,oklch(0.27 0.05 80 / 0.55),var(--ink-1) 60%);border:1px solid var(--gold-line);border-radius:var(--rad);padding:var(--pad) var(--pad) var(--pad) 16px}
.guide-ico{--sw:1.8;width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.guide-ico .ico{width:20px;height:20px}
.guide-body{display:grid;gap:1px;min-width:0}
.guide-body b{font-size:15px}
.guide .btn{border-radius:calc(var(--rad) - var(--pad))}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.done{background:var(--gold-lo)}
.dots i.on{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
@media (max-width:760px){.guide{grid-template-columns:auto minmax(0,1fr) auto}.guide .dots{display:none}.guide .go{grid-column:1/-1;width:100%}.guide .hide{grid-row:1;grid-column:3}}

/* how it works */
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.how li{--pad:18px;--rad:24px;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--rad);padding:var(--pad);display:grid;gap:8px;align-content:start}
.how .n{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--gold);line-height:1}
.how b{font-size:15px}
.how span{color:var(--text-3);font-size:14px}
@media (max-width:900px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.how{grid-template-columns:minmax(0,1fr)}}

/* results */
.results-head{display:flex;gap:14px;align-items:center;min-width:0}
.best{--pad:24px;--rad:32px;--rin:calc(var(--rad) - var(--pad));background:linear-gradient(160deg in oklch,oklch(0.28 0.05 80 / 0.5),var(--ink-1) 55%);border:1px solid var(--gold-line);border-radius:var(--rad);padding:var(--pad);display:grid;gap:16px}
@media (max-width:520px){.best{--pad:18px;--rad:26px}}
.tag{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.bigpay{display:flex;gap:10px 16px;align-items:baseline;flex-wrap:wrap}
.bigpay .now{font-family:var(--f-display);font-size:clamp(40px,6vw,54px);font-weight:600;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.bigpay .was{color:var(--text-3);text-decoration:line-through;font-size:18px;font-variant-numeric:tabular-nums}
.how-line{--sw:1.6;display:flex;gap:10px;align-items:flex-start;color:var(--text-2);font-size:15px}
.how-line .ico{color:var(--gold);margin-top:3px}
.breakdown summary,.more summary{--sw:1.8;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text-2);font-weight:600;font-size:14px}
.breakdown summary{padding:4px 0}
.more summary{padding:14px 18px;border:1px solid var(--line);background:var(--ink-1);border-radius:20px}
.breakdown summary .ico,.more summary .ico{transition:transform .2s}
.breakdown[open] summary .ico,.more[open] summary .ico{transform:rotate(90deg)}
.breakdown .receipt{margin-top:10px}
.more .rows{display:grid;gap:8px;margin-top:10px}
.opt{--pad:14px;--rad:22px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:var(--pad);border:1px solid var(--line);border-radius:var(--rad);background:var(--ink-1);cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{background:var(--ink-2)}
.opt:has(input:checked){background:var(--ink-2);border-color:var(--gold-line)}
.opt input{accent-color:var(--gold);width:17px;height:17px;margin:0}
.opt.off{cursor:default;grid-template-columns:auto minmax(0,1fr);background:oklch(1 0 0 / 0.025)}
.opt.off:hover{background:oklch(1 0 0 / 0.025)}
.bank{min-width:52px;height:40px;padding:0 6px;border-radius:calc(var(--rad,22px) - var(--pad,14px));display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.06em;background:var(--ink-3);color:var(--celadon);border:1px solid var(--line)}
.opt-main{display:grid;gap:4px;min-width:0}
.opt-title{font-weight:700}
.opt-num{text-align:right;display:grid;gap:2px}
.opt-num .pay{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.opt-num .save{font-size:12.5px;color:var(--good);font-weight:700}
.opt .pill{white-space:normal}
@media (max-width:560px){.opt{grid-template-columns:auto auto minmax(0,1fr)}.opt-num{grid-column:3;text-align:left;display:flex;gap:10px;align-items:baseline}}
.addon{--pad:14px;--rad:22px;display:flex;gap:12px;align-items:flex-start;padding:var(--pad);border:1px dashed var(--gold-line);border-radius:var(--rad);cursor:pointer;background:oklch(0.82 0.135 84 / 0.04)}
.addon input{accent-color:var(--gold);width:18px;height:18px;margin-top:2px;flex:none}

.callout.warn{background:var(--warn-soft)}

/* sheet (checkout + live progress) */

  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{--pad:26px;--rad:34px;--rin:calc(var(--rad) - var(--pad));width:min(560px,100%);max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--ink-1);border:1px solid var(--line-2);border-radius:var(--rad);padding:var(--pad);display:grid;gap:18px;align-content:start}

}
.sumline{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}

.prog{list-style:none;margin:0;padding:0;display:grid;gap:0}

.prog li.done:not(:last-child)::after{background:linear-gradient(180deg in oklch,var(--gold),var(--gold-lo))}

.job{--pad:20px;--rad:30px;--rin:calc(var(--rad) - var(--pad));background:linear-gradient(160deg in oklch,oklch(0.27 0.05 80 / 0.45),var(--ink-1) 55%);border:1px solid var(--gold-line);border-radius:var(--rad);padding:var(--pad);display:grid;gap:16px}

.empty{--sw:1.6;border:1px dashed var(--line-2);border-radius:24px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;color:var(--text-2)}

/* vouchers */

  mask:radial-gradient(circle 9px at 0 var(--notch),transparent 97%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% var(--notch),transparent 97%,#000 100%) right/51% 100% no-repeat}

.ticket .brandname{font-family:var(--f-display);font-size:23px;font-weight:600;color:var(--celadon);line-height:26px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .vtitle{font-weight:700;margin-top:16px}

.vcode{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--text-3)}
.vcode.open{color:var(--gold-ink);background:linear-gradient(90deg in oklch,var(--gold-hi),var(--gold));padding:6px 12px;border-radius:8px;font-size:15px;font-weight:500}

/* ---------- checkout sheet ---------- */
function sheetView() {
  const sh = S.sheet; if (!sh) return '';
  let title = '', body = '';

    const ch = currentChoice();

    const { p, v, o } = ch;
    title = 'Pay for your order';
    body = `<div class="results-head"><span class="mini-tile">${art(p.art)}</span><div><h3>${esc(p.name)}</h3><span class="meta">${esc(p.merchant)} · with the ${esc(cardName(o.offer))} offer</span></div></div>
      <div class="stack" style="gap:8px">
        <div class="sumline"><span>Price on ${esc(p.merchant)}</span><span>${fmt(p.price)}</span></div>
        <div class="sumline green"><span>Your saving</span><span>${fmt(o.buyerPays - p.price)}</span></div>
        <div class="sumline tot"><span>You pay</span><span>${fmt(o.buyerPays)}</span></div>
      </div>
      <div class="field"><label for="addr">Deliver to</label><textarea id="addr" data-bound rows="3">${esc(S.buyer.address)}</textarea><span class="meta">Your helper sees this only after saying yes, so they can send it to you.</span></div>

      <div class="trust">${icon('shield')}<span>Your money is safe. OfferPool holds it and only pays the helper after your item arrives and the return period ends. If no helper can take it, you get every rupee back.</span></div>

  } else {

    const helperStep = o.fulfillerId ? 'done' : (['matching', 'offered'].includes(o.status) ? 'now' : 'todo');

    if (o.status === 'refunded') {

        <button class="btn primary wide" data-act="retry" data-pid="${o.pid}">Choose another way to pay</button>
        <button class="btn quiet" data-act="closeSheet">Close</button>`;
    } else if (['placed', 'shipped', 'delivered', 'settled'].includes(o.status)) {
      title = '';
      body = `<div class="success"><span class="seal">${icon('check')}</span><h2>Your order is placed</h2>${seam()}
          <p class="lede" style="font-size:16px">You paid <b style="color:var(--text)">${fmt(o.buyerPays)}</b> instead of ${fmt(o.price)}. That's <b style="color:var(--good)">${fmt(o.price - o.buyerPays)} saved</b> with the ${esc(o.offerBank)} offer.</p></div>
        <div class="facts"><div><span>Product</span><span>${esc(o.name)}</span></div><div><span>${esc(o.merchant)} order number</span><span class="mono">${esc(o.merchantOrderId)}</span></div>
          <div><span>Ordered by</span><span>${esc(o.fulfillerName)} · ${esc(o.fulfillerMeta || '')}</span></div><div><span>Arrives by</span><span>${fdate(addDays(TODAY, 3))}</span></div></div>
        <ul class="next"><li>${icon('truck')}<span>${esc(o.merchant)} ships it to your address and texts you the delivery code.</span></li>
          <li>${icon('shield')}<span>We pay the helper only after it arrives and the 7-day return period ends.</span></li>
          <li>${icon('refund')}<span>If it doesn't arrive or you return it, you get your money back.</span></li></ul>
        <button class="btn primary wide" data-act="trackOrder">Track my order</button>
        <button class="btn quiet" data-act="shopMore">Buy something else</button>`;
    } else {
      title = 'Placing your order';
      const waitingMe = o.status === 'offered' && o.offeredTo === 'me';
      const helperText = o.fulfillerId ? `<b>${esc(o.fulfillerName)} said yes</b><span class="meta">${esc(o.fulfillerMeta || '')} · has ${esc(aBank(o.offerBank))} credit card</span>`
        : waitingMe ? `<b>Waiting for Kabir (you)</b><span class="meta">You asked to try the helper side. Accept it in Earn within <span class="mono" data-deadline="${o.deadline}">1:00</span>.</span>`

        : orderStep === 'now' ? `<b>Ordering it on ${esc(o.merchant)} with the ${esc(o.offerBank)} offer</b><span class="meta">We check the order number, card, price and your address</span>`
        : `<b>Order it on ${esc(o.merchant)} with the ${esc(o.offerBank)} offer</b>`;
      const dot = st => st === 'done' ? icon('check') : st === 'now' ? '<span class="spin" aria-hidden="true"></span>' : '';
      body = `<div class="results-head"><span class="mini-tile">${art(o.art)}</span><div><h3>${esc(o.name)}</h3><span class="meta">You paid ${fmt(o.buyerPays)} · saving ${fmt(o.price - o.buyerPays)}</span></div></div>
        <ol class="prog" aria-live="polite">
          <li class="done"><span class="dot">${dot('done')}</span><span class="txt"><b>Payment received</b><span class="meta">${fmt(o.buyerPays)} held safely by OfferPool</span></span></li>
          <li class="${helperStep}"><span class="dot">${dot(helperStep)}</span><span class="txt">${helperText}</span></li>
          <li class="${orderStep}"><span class="dot">${dot(orderStep)}</span><span class="txt">${orderText}</span></li>
        </ol>
        ${o.status === 'price_check' ? `<div class="row"><button class="btn primary" data-act="priceOk" data-id="${o.id}">Pay ${fmt(o.priceDelta)} more</button><button class="btn" data-act="priceNo" data-id="${o.id}">Cancel and refund</button></div>` : ''}
        ${waitingMe ? `<button class="btn primary wide" data-act="toEarn">Open Earn to accept</button>` : ''}
        <div class="trust">${icon('shield')}<span>If no helper can take it, your money comes straight back.</span></div>`;
    }
  }
  return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title || 'Order placed')}">
    <div class="sheet-head">${title ? `<h2>${esc(title)}</h2>` : '<span></span>'}<button class="btn quiet icon-only" data-act="closeSheet" aria-label="Close">${icon('x')}</button></div>${body}</div></div>`;
}

function orderCard(o) {
  const st = stageOf(o.status), acts = [], user = [], demo = [];
  if (o.status === 'offered' && o.offeredTo === 'me') acts.push(`<div class="callout info"><span>${icon('clock')} This order is waiting for <b>Kabir</b>, the helper you play in Earn. Accept it there within <b class="mono" data-deadline="${o.deadline}">1:00</b>, or it goes to the next helper.</span><div><button class="btn sm primary" data-act="go" data-view="earn">Open Earn ${icon('arrow')}</button></div></div>`);
  if (o.status === 'price_check') acts.push(`<div class="callout warn"><b>${icon('alert')} ${esc(o.merchant)}'s price went up by ${fmt(o.priceDelta)}.</b><span>Pay the difference and the order goes ahead, or cancel and get all ${fmt(o.buyerPays)} back.</span><div class="row"><button class="btn sm primary" data-act="priceOk" data-id="${o.id}">Pay ${fmt(o.priceDelta)} more</button><button class="btn sm" data-act="priceNo" data-id="${o.id}">Cancel and refund</button></div></div>`);

  if (o.status === 'delivered') user.push(`<button class="btn sm danger" data-act="return" data-id="${o.id}">Return item</button>`);
  if (o.status === 'placed') demo.push(`<button class="btn sm demo" data-act="adv" data-step="ship" data-id="${o.id}">Ship it</button>`);
  if (o.status === 'shipped') demo.push(`<button class="btn sm demo" data-act="adv" data-step="deliver" data-id="${o.id}">Deliver it</button>`);
  if (o.status === 'delivered') demo.push(`<button class="btn sm demo" data-act="adv" data-step="settle" data-id="${o.id}">Skip the 7-day return period</button>`);
  const k = 'act:' + o.id;
  return `<article class="panel order">
    <div class="order-head"><div class="who"><span class="mini-tile">${art(o.art)}</span><div><h3>${esc(o.name)}</h3><span class="meta">${esc(o.merchant)} · ${esc(o.offerBank)} card offer${o.voucher ? ' + coupon code' : ''}${o.fulfillerName ? ' · ordered by ' + esc(o.fulfillerName) : ''}</span></div></div>

    ${acts.join('')}
    ${user.length || demo.length ? `<div class="actions">${user.join('')}${demo.length ? '<span class="lbl">Demo shortcuts</span>' + demo.join('') : ''}</div>` : ''}
    <details class="activity" data-ui="${k}" ${S.ui.open[k] ? 'open' : ''}><summary>${icon('chev')} What's happened so far (${o.timeline.length})</summary>
      <ol class="timeline">${o.timeline.map(e => `<li><time>${e.t}</time>${esc(e.text)}</li>`).join('')}</ol></details>
  </article>`;

function viewEngine() {

  <div class="kpis">${kpi(os.length, 'Orders so far')}${kpi(done.length ? Math.round(matched.length / done.length * 100) + '%' : '–', 'Found a helper')}${kpi(times.length ? (times.reduce((a, b) => a + b, 0) / times.length).toFixed(0) + ' s' : '–', 'Average wait for a helper')}${kpi(fmt(held), 'Money we’re holding for shoppers')}${kpi(fmt(S.stats.platform + S.stats.voucher), 'OfferPool earnings', true)}${kpi(pool.filter(c => c.online).length + ' / ' + pool.length, 'Helpers available')}</div>

        <div class="funnel">${last.funnel.map(f => `<div class="f"><span>${esc(f.label)}</span><span class="bar"><span style="width:${f.count / last.funnel[0].count * 100}%"></span></span><b class="num">${f.count}</b></div>`).join('')}</div>
        ${last.ranked.length ? `<p class="meta"><b style="color:var(--text-2)">Asked in this order:</b> ${last.ranked.map(r => `${esc(r.name)} (${r.score.toFixed(2)})`).join(' · ')}</p>` : ''}`

      <div class="sub"><span class="meta"><b style="color:var(--text-2)">Ranking</b> = 40% how often they say yes + 25% how fast they order + 20% how long since their last order (so work is shared) + 15% how many offer uses they have left.</span></div>
    </div>

  ['E18', 'Paying helpers', 'Helpers are paid before their card bill is due', () => { const del = addDays(TODAY, 3); const cs = [15, 5, 28, 1].map(dd => { const due = dueDateFor(TODAY, dd), p = payoutDate(del, RETURN_DAYS, due); return { dd, ok: p.date < due && p.date > del, p }; }); return chk(cs.every(x => x.ok), 'Always after delivery and before the bill', cs.map(x => `bill ${x.dd} Dec → paid ${fdate(x.p.date)}${x.p.early ? ' (early)' : ''}`).join('; ')); }],
  ['E19', 'Refunds', 'Cancelling refunds the shopper in full, no reward paid', () => { const r = refundOnCancel({ status: 'shipped', buyerPays: 67100 }), s = refundOnCancel({ status: 'settled', buyerPays: 1 }); return chk(r.buyerRefund === 67100 && r.commission === 0 && r.instant && !s.allowed, 'Instant ₹67,100 refund, ₹0 reward; finished orders can’t be cancelled', `${fmt(r.buyerRefund)}, reward ${fmt(r.commission)}, finished cancellable: ${s.allowed}`); }],
  ['E20', 'Scope', 'Debit-card offers are not sent to helpers', () => { const o = buildOptions(productById('xm5'), [], basePool(), null, 'riya').opts.find(x => x.offer.id === 'am-hdfc-dc'); return chk(o.route === 'none' && /Debit/.test(o.reason), 'Shown, not sent', `${o.route}: ${o.reason}`); }],
  ['E21', 'Coupon + offer', 'Bank offer minimum is rechecked after a coupon', () => { const o = buildOptions({ id: 't', merchant: 'Flipkart', price: 10200 }, [], basePool(), { face: 500, price: 150 }, 'riya').opts.find(x => x.offer.id === 'fk-hdfc-cc'); return chk(!o.calc.eligible, 'HDFC drops out (₹9,700 is under ₹10,000)', o.calc.eligible ? 'Still usable' : o.reason); }],
  ['E22', 'Coupon codes', 'A code must fit the order', () => { const v = INITIAL_VOUCHERS.find(x => x.id === 'v4'); const a = voucherApplicable(v, 'Flipkart', 25000, TODAY), b = voucherApplicable(v, 'Flipkart', 69900, TODAY); return chk(!a.ok && b.ok, 'No on ₹25,000; yes on ₹69,900', `${a.reason} / ${b.reason}`); }],
  ['E23', 'Coupon codes', 'Expired codes are removed from sale', () => { const l = marketVouchers(INITIAL_VOUCHERS, TODAY); return chk(!l.some(v => v.id === 'v9') && l.length === 8, 'v9 (expired 20 Nov) hidden; 8 shown', `${l.length} shown; v9 ${l.some(v => v.id === 'v9') ? 'shown' : 'hidden'}`); }],
  ['E24', 'Coupon codes', "The same code can't be sold twice", () => { const e = validateListing({ code: 'swgy150xk9', face: 150, expires: '2026-12-30', brand: 'Swiggy', kind: 'promo' }, INITIAL_VOUCHERS, TODAY); return chk(e.some(x => /already listed/.test(x)), 'Rejected as a duplicate (any letter case)', e.join(' ') || 'Accepted'); }],
  ['E25', 'Coupon codes', 'Suggested price drops as expiry nears', () => { const v = { brand: 'Swiggy', kind: 'promo', face: 200 }; const f = suggestPrice({ ...v, expires: '2026-12-31' }, TODAY), w = suggestPrice({ ...v, expires: '2026-11-30' }, TODAY), s = suggestPrice({ ...v, expires: '2026-11-26' }, TODAY); return chk(f > w && w > s, 'Next month > this week > tomorrow', `${fmt(f)} > ${fmt(w)} > ${fmt(s)}`); }],
  ['E26', 'Coupon codes', "A code that doesn't work: buyer refunded, seller gets nothing", () => { const r = resolveVoucher({ paid: 50, fee: 8 }, false), ok = resolveVoucher({ paid: 50, fee: 8 }, true); return chk(r.buyerRefund === 50 && r.sellerPayout === 0 && r.strike && ok.sellerPayout === 42, 'Refund ₹50, seller ₹0 + warning; if it works, seller ₹42', `refund ${fmt(r.buyerRefund)}, seller ${fmt(r.sellerPayout)}, warning ${r.strike}; worked → seller ${fmt(ok.sellerPayout)}`); }],
  ['E27', 'Coupon codes', 'Fees: 15% on discount codes, 3% on gift cards', () => { const a = voucherFee({ kind: 'promo' }, 50), b = voucherFee({ kind: 'gift' }, 920); return chk(a === 8 && b === 28, '₹8 on ₹50; ₹28 on ₹920', `${fmt(a)}; ${fmt(b)}`); }],
  ['E28', 'Input', 'Unsupported or unknown links get a clear message', () => { const a = parseLink('https://www.myntra.com/shoes/123'), b = parseLink('https://www.amazon.in/dp/UNKNOWN'), c = parseLink(PRODUCTS[0].url); return chk(a.error && b.error && c.product && c.product.id === 'iphone16', 'Myntra and unknown product explained; sample link read', `${a.error ? 'message' : 'none'} / ${b.error ? 'message' : 'none'} / ${c.product ? c.product.id : 'none'}`); }],
];
function runEvals() { return EVALS.map(([id, area, name, fn]) => { try { return { id, area, name, ...fn() }; } catch (e) { return { id, area, name, pass: false, expected: '', actual: 'Error: ' + e.message }; } }); }
function viewEvals() {
  const res = runEvals(), passed = res.filter(r => r.pass).length, pct = Math.round(passed / res.length * 100);
  return `<section class="hero"><p class="eyebrow">${icon('checkc')} Behind the scenes</p>
    <div class="row" style="gap:20px"><div class="ring" style="--p:${pct}%" role="img" aria-label="${passed} of ${res.length} passing"><span>${pct}%</span></div>
    <h1>${passed} of ${res.length} <em>tests pass</em>.</h1></div>${seam()}
    <p class="lede">Each time you open this tab, these run the app's real pricing, helper-matching, order-checking, payment and coupon-code rules against fixed examples. Each one guards against something that could go wrong: a wrong price, the wrong helper, a fake order, a late payment or a bad code.</p>
    <div><button class="btn outline" data-act="go" data-view="evals">Run again ${icon('refund')}</button></div></section>
  <div class="tablewrap"><table class="data"><thead><tr><th>ID</th><th>Area</th><th>What it checks</th><th>Expected</th><th>Got</th><th>Result</th></tr></thead><tbody>
  ${res.map(r => `<tr><td class="mono">${r.id}</td><td>${esc(r.area)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.expected)}</td><td>${esc(r.actual)}</td><td><span class="${r.pass ? 'pass' : 'fail'}">${icon(r.pass ? 'check' : 'x')}${r.pass ? 'Pass' : 'Fail'}</span></td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- render & routing ---------- */
const VIEWS = { shop: ['Shop', 'bag', viewShop], earn: ['Earn', 'wallet', viewEarn], vouchers: ['Coupon codes', 'ticket', viewVouchers], engine: ['Behind the scenes', 'flow', viewEngine], evals: ['Tests', 'checkc', viewEvals] };
const SHORT = { vouchers: 'Codes', engine: 'Inside' };
function renderNav() {
  const n = S.orders.filter(o => (o.status === 'offered' && o.offeredTo === 'me') || (o.fulfillerId === 'me' && o.status === 'accepted')).length;
  const btn = (k, minor, short) => `<button class="tab ${minor ? 'minor' : ''}" data-act="go" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${icon(VIEWS[k][1])}<span>${short && SHORT[k] ? SHORT[k] : VIEWS[k][0]}</span>${k === 'earn' && n ? `<span class="badge">${n}</span>` : ''}</button>`;
  document.getElementById('tabs').innerHTML = btn('shop') + btn('earn') + btn('vouchers') + '<span class="sep" aria-hidden="true"></span>' + btn('engine', 1) + btn('evals', 1);
  document.getElementById('bnav').innerHTML = Object.keys(VIEWS).map(k => btn(k, 0, 1)).join('');
}
function render(opts = {}) {
  const view = document.getElementById('view'), sheetEl = document.getElementById('sheet'), saved = {}; let focusId = null, sel = null;
  if (!opts.fresh) {
    [view, sheetEl].forEach(c => c.querySelectorAll('input,select,textarea').forEach(el => { if (!el.id || el.type === 'radio' || el.type === 'file' || el.hasAttribute('data-bound')) return; saved[el.id] = el.type === 'checkbox' ? el.checked : el.value; }));
    const ae = document.activeElement; if (ae && ae.id && (view.contains(ae) || sheetEl.contains(ae))) { focusId = ae.id; try { sel = ae.selectionStart; } catch (e) { } }
  }
  const hadSheet = !!sheetEl.firstElementChild;
  view.innerHTML = guideBar() + VIEWS[S.view][2]();
  sheetEl.innerHTML = sheetView();
  document.body.classList.toggle('locked', !!S.sheet);
  for (const [id, v] of Object.entries(saved)) { const el = document.getElementById(id); if (!el) continue; if (el.type === 'checkbox') el.checked = v; else el.value = v; }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
  else if (S.sheet && !hadSheet) { const b = sheetEl.querySelector('.btn.primary') || sheetEl.querySelector('[data-act="closeSheet"]'); if (b) b.focus({ preventScroll: true }); }
  if (S.view === 'vouchers' && S.vTab === 'sell') updateSellPreview();
  renderNav(); tick();
}
function go(view) { if (!VIEWS[view]) view = 'shop'; S.view = view; S.sheet = null; if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view); render({ fresh: true }); window.scrollTo(0, 0); }
function scrollToId(id) { requestAnimationFrame(() => { const el = document.getElementById(id); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 90; window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } }); }
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) { S.view = v; S.sheet = null; render({ fresh: true }); } });
function updateSellPreview() { const p = sellPreview(), a = document.getElementById('s-sug'), b = document.getElementById('s-net'); if (a) a.textContent = p.text; if (b) b.textContent = p.net; }
function analyse(product) { S.analysis = { pid: product.id, choice: null, voucherId: null }; S.linkError = ''; S.linkInput = product.url; S.ui.open.others = false; S.ui.open.bad = false; S.ui.open.breakdown = false; }
function closeSheet() { S.sheet = null; render(); }

/* ---------- events ---------- */
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-ui]')) S.ui.open[d.dataset.ui] = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'linkForm') { const r = parseLink(S.linkInput); if (r.error) { S.linkError = r.error; S.analysis = null; } else analyse(r.product); render(); if (S.analysis) scrollToId('results'); }
  if (e.target.id === 'sellForm') {
    const f = readSellForm(), v = { ...f, price: f.price > 0 ? f.price : suggestPrice(f, TODAY) };
    const errs = validateListing(v, S.vouchers, TODAY); S.sellErrors = errs;
    if (errs.length) { render(); return; }
    S.vouchers.unshift({ id: 'm' + (S.vseq++), ...v, code: v.code.trim(), seller: 'Kabir', sellerRating: 4.8, status: 'listed', mine: true });
    S.vTab = 'mine'; toast(`Up for sale at ${fmt(v.price)}. Buyers see the code only after paying.`); render({ fresh: true });
  }
});
document.addEventListener('input', e => { const t = e.target; if (t.id === 'link') S.linkInput = t.value; if (t.id === 'addr') S.buyer.address = t.value; if (t.closest && t.closest('#sellForm')) updateSellPreview(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'opt' && S.analysis) { S.analysis.choice = t.value; S.ui.open.others = false; render(); scrollToId('results'); return; }
  if (t.id === 'vf-brand') { S.vf.brand = t.value; render(); return; }
  if (t.id === 'vf-cart') { S.vf.cart = t.value; render(); return; }
  if (t.closest && t.closest('#sellForm')) updateSellPreview();
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, order = id ? S.orders.find(o => o.id === id) : null;
  switch (act) {
    case 'scrim': if (e.target === t) closeSheet(); break;
    case 'closeSheet': closeSheet(); break;
    case 'go': go(t.dataset.view); break;
    case 'guide': { const g = guideStep(); if (g.sample) analyse(productById(g.sample)); go(g.go); if (g.sample) scrollToId('results'); else if (g.scroll) scrollToId(g.scroll); break; }
    case 'hideGuide': S.ui.guideHidden = true; writePref('guideHidden', '1'); render(); break;
    case 'showGuide': S.ui.guideHidden = false; writePref('guideHidden', '0'); render(); window.scrollTo(0, 0); break;
    case 'sample': analyse(productById(id)); render(); scrollToId('results'); break;
    case 'addBuyerCard': { const bank = document.getElementById('nb-bank').value, type = document.getElementById('nb-type').value; if (!S.buyer.cards.some(k => k.bank === bank && k.type === type)) S.buyer.cards.push({ bank, type }); render(); break; }
    case 'rmBuyerCard': S.buyer.cards.splice(+t.dataset.i, 1); render(); break;
    case 'pickVoucher': S.analysis.voucherId = t.checked ? id : null; render(); break;
    case 'openCheckout': S.sheet = { mode: 'checkout' }; render(); break;
    case 'pay': { const o = placeOrder(); if (o) { S.sheet = { mode: 'progress', orderId: o.id }; render(); } break; }
    case 'retry': S.sheet = null; analyse(productById(t.dataset.pid)); render(); scrollToId('results'); break;
    case 'trackOrder': S.sheet = null; render(); scrollToId('orders'); break;
    case 'shopMore': S.sheet = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'toEarn': go('earn'); break;
    case 'sampleRequest': {
      analyse(productById('mba'));
      const ch = currentChoice();
      if (!ch.o || ch.o.route !== 'match' || !fullPool().some(c => c.id === 'me' && c.online)) { S.analysis = null; toast('No sample request fits your cards and preferences right now.'); render(); break; }
      const o = placeOrder({ forceMe: true });
      if (o && o.offeredTo !== 'me' && o.fulfillerId !== 'me') toast('Your cards or preferences don’t fit this request, so another helper took it.');
      render(); break; }
    case 'priceOk': if (order && order.status === 'price_check') { order.buyerPays += order.priceDelta; order.cardholderPays += order.priceDelta; order.status = 'placed'; tl(order, `You agreed to pay ${fmt(order.priceDelta)} more. Order ${order.merchantOrderId} goes ahead.`); log(order.id, 'Shopper approved the new price.', 'good'); render(); } break;
    case 'priceNo': if (order) cancelOrder(order, 'price'); break;
    case 'cancel': if (order) cancelOrder(order, 'cancel'); break;
    case 'return': if (order) cancelOrder(order, 'return'); break;
    case 'adv': if (order) advance(order, t.dataset.step); break;
    case 'online': S.me.online = t.checked; log('—', `Kabir (you) is ${t.checked ? 'available' : 'not available'}.`); render(); break;
    case 'accept': if (order && order.status === 'offered' && order.offeredTo === 'me') acceptJob(order, 'me'); break;
    case 'decline': if (order && order.offeredTo === 'me') { log(order.id, 'Kabir (you) said not now.', 'warn'); tl(order, 'Kabir couldn’t take it. Asking the next helper.'); offerNext(order); } break;
    case 'copyAddr': case 'copyCode': {
      const el = document.getElementById(act === 'copyAddr' ? 'addr-' + id : 'code-' + id), text = el.textContent;
      const done = () => { t.classList.add('done'); setTimeout(() => t.classList.remove('done'), 1600); };
      try { await navigator.clipboard.writeText(text); done(); toast('Copied'); } catch (err) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(); toast('Selected. Press Ctrl+C to copy.'); }
      break; }
    case 'fillSample': case 'fillBad': {
      document.getElementById('f-oid-' + id).value = act === 'fillBad' ? 'OD12345' : genOrderId(order.merchant);
      document.getElementById('f-amt-' + id).value = order.cardholderPays;
      document.getElementById('f-card-' + id).value = order.offerBank;
      document.getElementById('f-addr-' + id).checked = true; break; }
    case 'submitOrder': {
      if (!order || order.status !== 'accepted') break;
      const oid = document.getElementById('f-oid-' + id).value, paid = Number(document.getElementById('f-amt-' + id).value);
      const res = verifyOrder({ merchant: order.merchant, orderId: oid, paid, expected: order.cardholderPays, cardBank: document.getElementById('f-card-' + id).value, offerBank: order.offerBank, addressOk: document.getElementById('f-addr-' + id).checked });
      if (applyVerification(order, res, paid, oid.trim())) toast(res.outcome === 'price_changed' ? "We've asked Riya to approve the new price." : 'All checks passed. Riya can track her order now.');
      render(); break; }
    case 'earnTab': S.ui.earnTab = t.dataset.tab; render({ fresh: true }); break;
    case 'rmCard': if (S.me.cards.length > 1) { S.me.cards.splice(+t.dataset.i, 1); render(); } else toast('Keep at least one card.'); break;
    case 'addCard': {
      const bank = document.getElementById('ac-bank').value, variant = document.getElementById('ac-var').value.trim() || 'Credit card', due = Math.min(28, Math.max(1, Number(document.getElementById('ac-due').value) || 10));
      if (S.me.cards.some(k => k.bank === bank)) { toast(`You already have a ${bank} card here.`); break; }
      S.me.cards.push({ bank, type: 'credit', variant, dueDay: due }); toast(`${bank} ${variant} added.`); render({ fresh: true }); break; }
    case 'saveRules': {
      const m = []; if (document.getElementById('r-fk').checked) m.push('Flipkart'); if (document.getElementById('r-am').checked) m.push('Amazon');
      S.me.merchants = m; S.me.maxOrder = Number(document.getElementById('r-max').value) || 0; S.me.minCommission = Number(document.getElementById('r-minc').value) || 0; S.me.autoAccept = document.getElementById('r-auto').checked;
      toast('Saved. New requests will follow these.'); render(); break; }
    case 'vtab': S.vTab = t.dataset.tab; S.sellErrors = []; render({ fresh: true }); break;
    case 'buyVoucher': {
      const v = S.vouchers.find(x => x.id === id && x.status === 'listed'); if (!v) break;
      v.status = 'sold';
      S.vbuys.unshift({ id: 'VB' + (S.vseq++), vid: v.id, brand: v.brand, title: voucherTitle(v), code: v.code, paid: v.price, fee: voucherFee(v, v.price), seller: v.seller, status: 'revealed' });
      S.sheet = null; S.view = 'vouchers'; S.vTab = 'mine'; history.replaceState(null, '', '#vouchers'); toast(`Paid ${fmt(v.price)}. Here's your code.`); render({ fresh: true }); window.scrollTo(0, 0); break; }
    case 'sampleShot': { const b = S.vbuys.find(x => x.id === id); if (b) { b.shot = 'checkout-error.png'; b.needShot = false; render(); } break; }
    case 'vWorked': case 'vFailed': {
      const b = S.vbuys.find(x => x.id === id); if (!b || b.status !== 'revealed') break;
      if (act === 'vFailed') { const f = document.getElementById('shot-' + id); if (!b.shot && f && f.files && f.files[0]) b.shot = f.files[0].name; if (!b.shot) { b.needShot = true; render(); break; } }
      const r = resolveVoucher(b, act === 'vWorked');
      b.status = act === 'vWorked' ? 'confirmed' : 'refunded';
      if (r.strike) S.sellerStrikes[b.seller] = (S.sellerStrikes[b.seller] || 0) + 1; else S.stats.voucher += r.platform;
      log(b.id, act === 'vWorked' ? `Code worked. ${b.seller} gets ${fmt(r.sellerPayout)} tomorrow; fee ${fmt(r.platform)}.` : `Code didn't work. Buyer refunded ${fmt(r.buyerRefund)}; warning for ${b.seller}.`, act === 'vWorked' ? 'good' : 'bad');
      toast(act === 'vWorked' ? 'Thanks. The seller will be paid.' : `${fmt(r.buyerRefund)} refunded.`); render(); break; }
    case 'scanSample': S.scanned = clone(SCANNED_SAMPLE); render(); break;
    case 'listScanned': {
      let n = 0; const skipped = [];
      for (const v of S.scanned) { const price = suggestPrice(v, TODAY); if (validateListing({ ...v, price }, S.vouchers, TODAY).length) { skipped.push(v.brand); continue; } S.vouchers.unshift({ id: 'm' + (S.vseq++), ...v, price, seller: 'Kabir', sellerRating: 4.8, status: 'listed', mine: true }); n++; }
      S.scanned = null; S.vTab = 'mine'; toast(`${n} code${n === 1 ? '' : 's'} up for sale${skipped.length ? `. Skipped ${skipped.join(', ')} (already for sale)` : ''}.`); render({ fresh: true }); break; }
    case 'simBuyer': { const v = S.vouchers.find(x => x.id === id); if (v) { v.status = 'sold'; S.stats.voucher += voucherFee(v, v.price); log(v.id, `Your ${v.brand} code sold for ${fmt(v.price)}.`, 'good'); toast('Sold. You get paid once the buyer confirms it worked.'); render(); } break; }
    case 'setPreferMe': S.settings.preferMe = t.checked; break;
    case 'setSayNo': S.settings.sayNo = t.checked; break;
    case 'setPriceChange': S.settings.priceChange = t.checked; break;
    case 'toggleOnline': { const c = findCh(id); if (c) { c.online = t.checked; log('—', `${chName(id)} is ${c.online ? 'available' : 'not available'}.`); render(); } break; }
    case 'allOffline': fullPool().forEach(c => c.online = false); log('—', 'Every helper is unavailable.', 'warn'); render(); break;
    case 'allOnline': fullPool().forEach(c => c.online = true); log('—', 'Every helper is available.'); render(); break;
    case 'reset': { const hidden = S.ui.guideHidden; S = freshState(); S.ui.guideHidden = hidden; go('shop'); toast('The demo has started again.'); break; }
  }
});
function tick() {
  const now = Date.now();
  for (const o of S.orders) if (o.status === 'offered' && o.offeredTo === 'me' && o.deadline && now > o.deadline) {
    o.deadline = null; log(o.id, `Kabir (you) didn't answer in ${ACCEPT_SECONDS} s. Asking the next helper.`, 'warn'); tl(o, 'Kabir didn’t answer in time. Asking the next helper.'); offerNext(o); return;
  }
  document.querySelectorAll('[data-deadline]').forEach(el => { const left = Math.max(0, Math.ceil((+el.dataset.deadline - now) / 1000)); el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); });
}
setInterval(tick, 1000);
go(location.hash.slice(1) || 'shop');
</script>
