<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OfferPool</title>
  <meta name="description" content="Get bank-card offers without the bank card. A verified helper who has the card buys it for you, and you keep most of the discount.">
  <meta name="theme-color" content="#14181f">
  <meta property="og:title" content="OfferPool">
  <meta property="og:description" content="Bank offers, unlocked. A helper with the right card buys it for you, and you keep most of the discount.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="seamGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="oklch(0.68 0.14 68)" stop-opacity="0"/><stop offset=".25" stop-color="oklch(0.82 0.135 84)"/>
    <stop offset=".7" stop-color="oklch(0.90 0.10 92)"/><stop offset="1" stop-color="oklch(0.82 0.135 84)" stop-opacity="0"/></linearGradient></defs>
</svg>
<div class="app">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#shop" aria-label="OfferPool home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="oklch(0.87 0.065 150)"/><path d="M10 5.5 L14.5 12 L11.5 17 L17.5 21 L15.5 27" fill="none" stroke="oklch(0.82 0.135 84)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 12 L20 10.5" fill="none" stroke="oklch(0.82 0.135 84)" stroke-width="1.6" stroke-linecap="round"/></svg>
        OfferPool</a>
      <nav class="tabs" id="tabs" aria-label="Main"></nav>
      <span class="proto" title="Banks, offers, prices and people are sample data">Demo</span>
    </div>
  </header>
  <main class="wrap" id="view"><noscript><p style="padding:24px">OfferPool needs JavaScript to run.</p></noscript></main>
  <footer class="foot"><span>This is a demo with sample data. Banks, offers, prices and people are made up for illustration.</span><button class="btn quiet sm" data-act="showGuide" id="showGuide" hidden>Show the step-by-step guide</button></footer>
</div>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/src/main.js"></script>

</html>
